spring:
  application:
    name: iam-service
  datasource:
    # Individual env vars so local dev can override just DB_PORT (e.g. 5433 when
    # another Postgres owns 5432). Fully-formed DB_URL still wins if set.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hirevo}}
    username: ${DB_USER:dev}
    password: ${DB_PASSWORD:dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.time_zone: Asia/Jakarta
      hibernate.default_schema: iam
      hibernate.format_sql: false
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${SERVER_PORT:8081}
  compression:
    enabled: true
  error:
    include-message: always

hirevo:
  security:
    jwt:
      issuer: ${JWT_ISSUER:http://localhost:8081}
      algorithm: HS256
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
      hmac-secret: ${JWT_HMAC_SECRET:change-me-locally-only-in-dev-use-rs256-with-kms-in-prod-32chars-minimum!!!}
    field-encryption:
      key-base64: ${FIELD_ENC_KEY:qeYqCEsBGqK9wCk8jFvXsK9lF4B0kR9wUwB3wKt5S1s=}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,liquibase
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  # OTel tracing config commented out — starter jar removed from POM until
  # incubator/SDK version alignment is fixed. Prometheus metrics still
  # exposed via micrometer at /actuator/prometheus.

logging:
  level:
    root: INFO
    com.hirevo: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [tenant=%X{tenant_id:-}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
